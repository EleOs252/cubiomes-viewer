name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: msys2 {0}

env:
  PROG:         cubiomes-viewer
  SOURCE_DIR:   ${{github.workspace}}

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5-static
            git

      - name: Build (static)
        working-directory: ${{env.SOURCE_DIR}}
        shell: msys2 {0}
        run:  |
              mkdir build && cd build
              /mingw64/qt5-static/bin/qmake CONFIG+=release ..
              mingw32-make -j$(nproc)

      - name: Verify
        working-directory: ${{env.SOURCE_DIR}}
        shell: msys2 {0}
        run:  |
              build/release/${{env.PROG}}.exe --version
              ls -lh build/release/${{env.PROG}}.exe

      - name: Package
        working-directory: ${{env.SOURCE_DIR}}
        shell: powershell
        run:  |
              Copy-Item build\release\${{env.PROG}}.exe ${{env.PROG}}.exe
              Compress-Archive -Path ${{env.PROG}}.exe -DestinationPath ${{env.PROG}}-${{github.ref_name}}-win64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Cubiomes Viewer ${{github.ref_name}}
          body: |
            Pre-built Windows binary for Minecraft 26.2.
            Standalone executable ? no DLLs or dependencies required.
          files: |
            ${{env.SOURCE_DIR}}/${{env.PROG}}-${{github.ref_name}}-win64.zip
          draft: false
          prerelease: false
